<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out - ERP Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card shadow-sm">
                <div class="card-body py-5">
                    <h2 class="text-success mb-3">You have been logged out.</h2>
                    <p class="text-muted mb-4">Thank you for using the ERP Tracker.</p>
                    <a href="{% url 'login' %}" class="btn btn-primary px-4">Log back in</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
