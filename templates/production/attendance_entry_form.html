<!DOCTYPE html>
<html>
<head>
    <title>Attendance Entry</title>
</head>
<body>
    <h1>Attendance Entry</h1>
    <form method="post">
        {% csrf_token %}
        {% if form.non_field_errors %}
            <div style="color: red;">
                {% for error in form.non_field_errors %}
                    <p>{{ error }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <p>
            <label for="id_attendance_date">Date:</label>
            {{ form.attendance_date }}
        </p>
        <p>
            <label for="id_section">Section:</label>
            {{ form.section }}
        </p>
        <p>
            <label for="id_workers">Present Workers:</label>
            {{ form.workers }}
        </p>

        <button type="submit">Save Attendance</button>
    </form>
</body>
</html>
