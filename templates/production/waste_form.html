{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Waste Entry</h2>
    <form method="get" class="mb-3 d-flex gap-2 align-items-center">
        <label for="date" class="form-label mb-0">Date:</label>
        <input type="date" name="date" id="date" class="form-control w-auto" value="{{ entry_date|date:'Y-m-d' }}">

        <label for="section" class="form-label mb-0">Section:</label>
        <select name="section" id="section" class="form-select w-auto">
            {% for section in sections %}
            <option value="{{ section.id }}" {% if selected_section and selected_section.id == section.id %}selected{% endif %}>{{ section.name }}</option>
            {% endfor %}
        </select>
        <button type="submit" class="btn btn-secondary">Load Items</button>
    </form>

    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="date" value="{{ entry_date|date:'Y-m-d' }}">
        <input type="hidden" name="section" value="{{ selected_section.id|default:'' }}">
        {{ formset.management_form }}

        <table class="table table-bordered">
            <thead class="table-light">
                <tr>
                    <th>Item</th>
                    <th>Waste Qty</th>
                </tr>
            </thead>
            <tbody>
                {% for form in formset %}
                <tr>
                    {{ form.id }}
                    <td>{{ form.item_name }}</td>
                    <td>{{ form.waste_qty }} {{ form.waste_qty.errors }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <button type="submit" class="btn btn-primary">Save Waste Entries</button>
    </form>
</div>
{% endblock %}
