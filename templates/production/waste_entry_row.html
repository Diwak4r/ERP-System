<tr>
    <td>{{ form.item }}</td>
    <td>{{ form.waste_qty }}</td>
    <td>{{ form.reason }}</td>
</tr>
{% if form.non_field_errors %}
<tr>
    <td colspan="3" style="color: red;">
        {% for error in form.non_field_errors %}{{ error }}{% if not forloop.last %}<br>{% endif %}{% endfor %}
    </td>
</tr>
{% endif %}
