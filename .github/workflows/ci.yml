name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy .

      - name: Test
        run: pytest

      - name: Deploy check (prod settings)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          # Use a real-looking 50-char key so W009 doesn't fire
          DJANGO_SECRET_KEY: "ci-deploy-check-key-abcdefghijklmnopqrstuvwxyz123456"
          DATABASE_URL: sqlite:///ci-deploy-check.db
          DJANGO_ALLOWED_HOSTS: example.com
          SECURE_SSL_REDIRECT: "false"      # reverse-proxy handles SSL in real prod
          SESSION_COOKIE_SECURE: "true"
          CSRF_COOKIE_SECURE: "true"
          SECURE_HSTS_SECONDS: "31536000"
        run: python manage.py check --deploy --settings=config.settings.prod
